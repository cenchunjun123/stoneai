[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoneai"
version = "0.1.0"
description = "AI automation toolkit for CAREL STone (c.suite 6.x) - build, diagnose, generate and drive STone projects without the IDE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["carel", "stone", "iec61131-3", "st", "plc", "automation", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
mcp = []

[project.scripts]
stoneai = "stoneai.cli:main"

[tool.setuptools]
packages = ["stoneai"]

[tool.setuptools.package-data]
stoneai = ["_bootstrap.py", "skills/*/SKILL.md", "skills/*/decrypt_isagraf.py"]
